---
- name: Ubuntu baseline
  hosts: ubuntu_nodes
  become: true
  vars:
    baseline_packages:
      - curl
      - wget
      - vim
      - htop
      - git
      - unzip
      - ca-certificates
      - gnupg
      - unattended-upgrades
      - apt-listchanges

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install baseline packages
      ansible.builtin.apt:
        name: "{{ baseline_packages }}"
        state: present

    - name: Install available safe upgrades
      ansible.builtin.apt:
        upgrade: safe

    - name: Enable unattended security upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    - name: Disable automatic reboot
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
        owner: root
        group: root
        mode: "0644"
        content: |
          Unattended-Upgrade::Automatic-Reboot "false";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";

    - name: Ensure unattended-upgrades is enabled
      ansible.builtin.systemd:
        name: unattended-upgrades
        enabled: true
        state: started

    - name: Check whether reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Report reboot requirement
      ansible.builtin.debug:
        msg: "REBOOT REQUIRED on {{ inventory_hostname }}"
      when: reboot_required.stat.exists
