---

- name: Prepare Ubuntu servers for k3s

  hosts: k3s_nodes

  become: true


  tasks:

    - name: Install required packages

      ansible.builtin.apt:

        name:

          - curl

          - ca-certificates

          - open-iscsi

          - nfs-common

        state: present

        update_cache: true


    - name: Enable and start iscsid

      ansible.builtin.systemd:

        name: iscsid

        enabled: true

        state: started


    - name: Disable swap

      ansible.builtin.command:

        cmd: swapoff -a

      when: ansible_facts["swaptotal_mb"] | int > 0

      changed_when: ansible_facts["swaptotal_mb"] | int > 0


    - name: Disable swap permanently in fstab

      ansible.builtin.replace:

        path: /etc/fstab

        regexp: '^([^#].*\s+swap\s+.*)$'

        replace: '# \1'

        backup: true


    - name: Load overlay kernel module

      community.general.modprobe:

        name: overlay

        state: present


    - name: Load br_netfilter kernel module

      community.general.modprobe:

        name: br_netfilter

        state: present


    - name: Load required modules at boot

      ansible.builtin.copy:

        dest: /etc/modules-load.d/k3s.conf

        owner: root

        group: root

        mode: "0644"

        content: |

          overlay

          br_netfilter


    - name: Configure Kubernetes sysctl settings

      ansible.builtin.copy:

        dest: /etc/sysctl.d/99-k3s.conf

        owner: root

        group: root

        mode: "0644"

        content: |

          net.bridge.bridge-nf-call-iptables = 1

          net.bridge.bridge-nf-call-ip6tables = 1

          net.ipv4.ip_forward = 1


    - name: Apply sysctl settings

      ansible.builtin.command:

        cmd: sysctl --system

      changed_when: true


    - name: Verify IPv4 forwarding

      ansible.builtin.command:

        cmd: sysctl net.ipv4.ip_forward

      register: ip_forward

      changed_when: false


    - name: Display IPv4 forwarding status

      ansible.builtin.debug:

        msg: "{{ inventory_hostname }}: {{ ip_forward.stdout }}"


    - name: Check active swap

      ansible.builtin.command:

        cmd: swapon --show

      register: swap_status

      changed_when: false


    - name: Display swap status

      ansible.builtin.debug:

        msg: >-

          {{ inventory_hostname }}:

          {{ 'No active swap' if swap_status.stdout == '' else swap_status.stdout }}


    - name: Verify required kernel modules

      ansible.builtin.shell:

        cmd: lsmod | grep -E '^(overlay|br_netfilter)'

      register: kernel_modules

      changed_when: false


    - name: Display loaded kernel modules

      ansible.builtin.debug:

        var: kernel_modules.stdout_lines
