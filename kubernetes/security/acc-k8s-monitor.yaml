apiVersion: v1
kind: Namespace
metadata:
  name: acc-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: acc-k8s-monitor
  namespace: acc-monitoring
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: acc-k8s-monitor-readonly
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: acc-k8s-monitor-readonly
subjects:
  - kind: ServiceAccount
    name: acc-k8s-monitor
    namespace: acc-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: acc-k8s-monitor-readonly
